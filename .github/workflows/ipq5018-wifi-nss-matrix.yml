name: Build IPQ5018 Wi-Fi NSS profile matrix

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - '.github/workflows/ipq5018-wifi-nss-matrix.yml'
      - '.github/workflows/ipq5018.yml'
      - 'feeds.conf.default'
      - 'nss-setup/**'
      - 'package/**'
      - 'target/**'
      - 'include/**'
      - 'toolchain/**'
      - 'tools/**'
      - 'rules.mk'
      - 'Makefile'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wi-Fi NSS 256M bring-up
    uses: ./.github/workflows/ipq5018.yml
    with:
      wifi_nss: true
      wifi_nss_mem_profile: '256'
