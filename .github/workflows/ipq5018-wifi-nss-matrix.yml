name: Build IPQ5018 Wi-Fi NSS profile matrix

on:
  push:
    branches:
      - feat/nss-ipq5018-autoload-wifi
    paths:
      - '.github/workflows/ipq5018-wifi-nss-matrix.yml'
      - '.github/workflows/ipq5018.yml'
      - 'feeds.conf.default'
      - 'nss-setup/**'
      - 'package/**'
      - 'target/**'
      - 'include/**'
      - 'toolchain/**'
      - 'tools/**'
      - 'rules.mk'
      - 'Makefile'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wi-Fi NSS ${{ matrix.mem_profile }}M
    strategy:
      fail-fast: false
      matrix:
        # 512 is the supported default on the 512MB MX2000; 1024 is the
        # experimental 1G A/B comparison. 256 stays covered by the local
        # shell test only to keep full-image build time down.
        mem_profile:
          - '512'
          - '1024'
    uses: ./.github/workflows/ipq5018.yml
    with:
      wifi_nss: true
      wifi_nss_mem_profile: ${{ matrix.mem_profile }}
