name: Build IPQ5018 NSS firmware

on:
  pull_request:
    paths:
      - '.github/workflows/ipq5018.yml'
      - 'config/**'
      - 'feeds.conf.default'
      - 'nss-setup/**'
      - 'package/**'
      - 'target/**'
      - 'include/**'
      - 'toolchain/**'
      - 'tools/**'
      - 'rules.mk'
      - 'Makefile'
      - 'scripts/**'
  push:
    branches:
      - feat/nss-ipq5018
      - 25.12-nss
    paths:
      - '.github/workflows/ipq5018.yml'
      - 'config/**'
      - 'feeds.conf.default'
      - 'nss-setup/**'
      - 'package/**'
      - 'target/**'
      - 'include/**'
      - 'toolchain/**'
      - 'tools/**'
      - 'rules.mk'
      - 'Makefile'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build Linksys MX2000 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 build-essential bison ccache clang flex g++ gawk gettext \
            libelf-dev libncurses-dev libssl-dev libzstd-dev perl python3 \
            python3-setuptools rsync unzip xsltproc zlib1g-dev file wget

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-v1-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'include/download.mk') }}
          restore-keys: |
            openwrt-dl-v1-${{ github.repository }}-${{ runner.os }}-

      - name: Restore feed cache
        id: feeds-cache
        uses: actions/cache@v4
        with:
          path: |
            feeds
            package/feeds
          key: openwrt-feeds-v3-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'nss-setup/patches/nss_packages/**') }}
          restore-keys: |
            openwrt-feeds-v3-${{ github.repository }}-${{ runner.os }}-

      - name: Update and install feeds
        if: steps.feeds-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify required NSS feeds
        run: |
          test -f feeds/nss_packages/qca-nss-drv/Makefile
          test -f feeds/nss_packages/qca-nss-clients/Makefile
          test -f feeds/nss_packages/qca-nss-ecm/Makefile
          test -f feeds/nss_packages/firmware/nss-firmware/Makefile

      - name: Apply local NSS feed patches
        run: |
          sh -n nss-setup/apply-feed-patches.sh
          nss-setup/apply-feed-patches.sh

      - name: Generate IPQ5018 config
        run: |
          cp nss-setup/config-ipq5018.seed .config
          make defconfig
          test "$(sed -n 's/^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mx2000=//p' .config)" = y
          ! grep -Eq '^CONFIG_ATH11K_NSS_SUPPORT=y$' .config
          grep -Eq '^CONFIG_NSS_FIRMWARE_VERSION_11_4=y$' .config
          grep -Eq '^CONFIG_PACKAGE_nss-firmware-ipq50xx=y$' .config
          grep -Eq '^CONFIG_NSS_DRV_MANUAL_BRINGUP=y$' .config
          grep -Eq '^CONFIG_CCACHE=y$' .config

      - name: Restore workspace host tools
        id: host-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            build_dir/host
          key: openwrt-hosttools-v2-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('tools/**', 'include/host-build.mk', 'include/host-compile.mk', 'include/prereq-build.mk', 'scripts/ext-tools.sh') }}
          restore-keys: |
            openwrt-hosttools-v2-${{ github.repository }}-${{ runner.os }}-

      - name: Build workspace host tools
        if: steps.host-tools-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf -- staging_dir/host build_dir/host
          make tools/install -j"$(nproc)" CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c V=s

      - name: Verify workspace host tools
        run: |
          test -d staging_dir/host
          test ! -L staging_dir/host
          test ! -L build_dir/host
          test -x staging_dir/host/bin/autom4te
          staging_dir/host/bin/autom4te --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: openwrt-ccache-v2-${{ github.repository }}-${{ runner.os }}-qualcommax-ipq50xx-k6.12-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-v2-${{ github.repository }}-${{ runner.os }}-qualcommax-ipq50xx-k6.12-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --show-stats

      - name: Restore IPQ5018 toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: openwrt-toolchain-v2-${{ github.repository }}-${{ runner.os }}-qualcommax-ipq50xx-k6.12-${{ hashFiles('toolchain/**', 'include/toolchain-build.mk', 'target/linux/qualcommax/Makefile') }}
          restore-keys: |
            openwrt-toolchain-v2-${{ github.repository }}-${{ runner.os }}-qualcommax-ipq50xx-k6.12-

      - name: Build IPQ5018 toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make toolchain/install -j"$(nproc)" CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c V=s

      - name: Check diagnostic script syntax
        run: |
          sh -n nss-setup/diagnose-ipq5018.sh
          sh -n target/linux/qualcommax/ipq50xx/base-files/etc/uci-defaults/90-ipq5018-nss-manual
          sh -n target/linux/qualcommax/ipq50xx/base-files/usr/sbin/nss-ipq5018-manual
          ! grep -Fq 'ip -br' nss-setup/diagnose-ipq5018.sh
          grep -Fq 'ip addr show' nss-setup/diagnose-ipq5018.sh

      - name: Verify MX2000 staged bring-up source
        run: |
          grep -Fx '#include "ipq5018-nss.dtsi"' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          ! grep -Fx '#include "ipq5018-nss-qcn6122.dtsi"' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          grep -Fq 'coherent_pool=2M clk_ignore_unused' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          ! grep -Fq 'pd_ignore_unused' target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-mx2000.dts
          grep -Fq 'NSS_DRV_MANUAL_BRINGUP' feeds/nss_packages/qca-nss-drv/Makefile
          grep -Fq "option enable '0'" feeds/nss_packages/qca-nss-ecm/files/qca-nss-ecm.uci
          grep -Fq "acceleration_engine='nss'" target/linux/qualcommax/ipq50xx/base-files/etc/uci-defaults/90-ipq5018-nss-manual
          grep -Fq 'ecm-on' target/linux/qualcommax/ipq50xx/base-files/usr/sbin/nss-ipq5018-manual
          grep -Fq 'NSS driver is not loaded; refusing to start ECM' feeds/nss_packages/qca-nss-ecm/files/qca-nss-ecm.init
          grep -Fq 'ECM node readback mismatch' feeds/nss_packages/qca-nss-ecm/files/qca-nss-ecm.init
          grep -Fq 'dsa_port_to_conduit' feeds/nss_packages/qca-nss-ecm/patches/0026-ipq5018-ecm-dsa-conduit-interface-resolution.patch
          grep -Fq 'ECM-DSA: dev=' feeds/nss_packages/qca-nss-ecm/patches/0027-ipq5018-ecm-dsa-resolution-trace.patch
          grep -Fq 'ECM-NSS: interface-establish' feeds/nss_packages/qca-nss-ecm/patches/0028-ipq5018-ecm-rule-resolution-trace.patch
          grep -Fq 'ECM-NSS: rule-submit' feeds/nss_packages/qca-nss-ecm/patches/0028-ipq5018-ecm-rule-resolution-trace.patch
          grep -Fq 'dsa_user_dev_check' package/kernel/qca-ssdk/patches/130-mp-ignore-dsa-user-port-events.patch
          grep -Fq 'qca-ssdk: notifier' package/kernel/qca-ssdk/patches/131-mp-trace-dsa-port-resolution.patch
          grep -Fq 'qca-ssdk: phy-resolve' package/kernel/qca-ssdk/patches/131-mp-trace-dsa-port-resolution.patch

      - name: Build kernel and NSS packages
        run: |
          make target/linux/compile \
            package/feeds/nss_packages/qca-nss-drv/compile \
            package/feeds/nss_packages/qca-nss-ecm/compile \
            -j"$(nproc)" CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c V=s

      - name: Build IPQ5018 firmware
        if: github.event_name != 'pull_request'
        run: make -j"$(nproc)" CONFIG_DOWNLOAD_TOOL_CUSTOM=aria2c V=s

      - name: Verify MX2000 NSS DTB and package manifest
        if: github.event_name != 'pull_request' && success()
        run: |
          dtc_bin=$(find build_dir/target-* -type f -path '*/linux-*/scripts/dtc/dtc' -perm -111 -print -quit)
          dtb=$(find build_dir/target-* -type f -name 'image-ipq5018-mx2000.dtb' -print -quit)
          test -n "$dtc_bin"
          test -n "$dtb"
          "$dtc_bin" -I dtb -O dts -o "$RUNNER_TEMP/mx2000.dts" "$dtb"
          grep -Fq 'nss-common' "$RUNNER_TEMP/mx2000.dts"
          grep -Fq 'nss@40000000' "$RUNNER_TEMP/mx2000.dts"
          grep -Fq 'memory@40000000' "$RUNNER_TEMP/mx2000.dts"
          grep -Fq '0x39d00000' "$RUNNER_TEMP/mx2000.dts"
          manifest=$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*.manifest' -print -quit)
          test -n "$manifest"
          grep -Eq '^kmod-qca-nss-dp([[:space:]]|$)' "$manifest"
          grep -Eq '^kmod-qca-nss-drv([[:space:]]|$)' "$manifest"
          grep -Eq '^kmod-qca-nss-ecm([[:space:]]|$)' "$manifest"
          grep -Eq '^nss-firmware-ipq50xx([[:space:]]|$)' "$manifest"

      - name: Collect build metadata
        if: always()
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%FT%TZ)"
            echo "event=${{ github.event_name }}"
            echo "target=qualcommax/ipq50xx"
            echo "device=linksys_mx2000"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > build-metadata.txt

          target_dir="bin/targets/qualcommax/ipq50xx"
          if [ -d "$target_dir" ]; then
            find "$target_dir" -maxdepth 1 -type f -printf '%f\n' | sort > build-files.txt
            find "$target_dir" -maxdepth 1 -type f \
              ! -name 'build-files.txt' ! -name 'build-sha256sums.txt' \
              -print0 | sort -z | xargs -0r sha256sum > build-sha256sums.txt
          fi

      - name: Upload firmware artifact
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-ipq5018-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            bin/targets/qualcommax/ipq50xx/**
            build-metadata.txt
            build-files.txt
            build-sha256sums.txt

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-ipq5018-ci-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            .config
            build-metadata.txt
            build-files.txt
            build-sha256sums.txt
            tmp/log/**
            bin/targets/qualcommax/ipq50xx/**
